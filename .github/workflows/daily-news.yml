name: AI 日报定时生成

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间 07:00 → 早报
    - cron: "0 13 * * *"   # UTC 13:00 = 北京时间 21:00 → 晚报
  workflow_dispatch:
    inputs:
      session:
        description: '日报时段 (morning/evening)'
        required: true
        default: 'morning'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpq-dev libxml2-dev libxslt1-dev

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip -q
          pip install -r requirements.txt -q
          playwright install chromium --with-deps -q 2>&1 | tail -3

      - name: 判断日报时段（根据触发时间）
        id: session
        run: |
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          if [ "$HOUR" -eq 7 ]; then
            echo "type=morning" >> $GITHUB_OUTPUT
          else
            echo "type=evening" >> $GITHUB_OUTPUT
          fi

      - name: 运行日报生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: |
          SESSION="${{ github.event.inputs.session || steps.session.outputs.type }}"
          echo "生成时段: $SESSION"
          python scripts/github_action_run.py --session "$SESSION"

      - name: 提交并推送日报数据
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "bot@aidaily.local"
          git add data/
          if git diff --staged --quiet; then
            echo "没有新数据，跳过提交"
          else
            # 先拉取远端避免冲突
            git pull --rebase origin main
            git commit -m "chore: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M') 日报数据更新"
            git push origin main
            echo "已提交并推送日报数据"
          fi
