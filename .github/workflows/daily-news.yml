name: AI 日报定时生成

on:
  schedule:
    - cron: "0 23 * * *"   # UTC 23:00 = 北京时间 07:00（早报）
    - cron: "0 13 * * *"   # UTC 13:00 = 北京时间 21:00（晚报）
  workflow_dispatch:        # 支持手动触发
    inputs:
      session:
        description: '日报时段 (morning/evening)'
        required: true
        default: 'morning'

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: 运行日报生成
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: |
          SESSION="${{ github.event.inputs.session || 'morning' }}"
          python scripts/github_action_run.py --session "$SESSION"

      - name: 提交日报数据
        run: |
          git config user.name "ai-daily-bot"
          git config user.email "bot@aidaily.local"
          git add data/
          git diff --staged --quiet || git commit -m "chore: $(date '+%Y-%m-%d %H:%M') 日报数据更新"
          git push
