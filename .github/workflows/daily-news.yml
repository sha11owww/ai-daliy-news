name: AI 日报定时生成

on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      session:
        description: 'morning / evening'
        required: true
        default: 'morning'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ainews
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
      - run: pip install -q -r requirements.txt

      - name: detect session
        id: session
        run: |
          HOUR=$(TZ='Asia/Shanghai' date +%H)
          if [ "$HOUR" -eq 7 ]; then echo "type=morning" >> $GITHUB_OUTPUT
          else echo "type=evening" >> $GITHUB_OUTPUT; fi

      - name: generate report
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ainews
        run: |
          S=${{ github.event.inputs.session || steps.session.outputs.type }}
          python scripts/github_action_run.py --session "$S" --config config.actions.yaml

      - name: commit and push
        run: |
          git config user.name "bot" && git config user.email "bot@local"
          git add data/
          if git diff --staged --quiet; then echo "no data"
          else
            git pull --rebase origin main || true
            git commit -m "chore: $(date '+%Y-%m-%d %H:%M') update"
            git push origin main
          fi
