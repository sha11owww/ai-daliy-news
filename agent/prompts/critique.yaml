name: critique
description: 摘要质量自审
template: |
  请审阅以下 AI 新闻摘要，检查是否有问题，返回 JSON：

  {{
    "pass": true/false,
    "issues": ["问题1"],
    "suggestion": "修改建议"
  }}

  标题：{title}
  摘要：{summary}

  检查清单：
  1. 关键信息是否清晰？
  2. 具体数字/数据是否保留？
  3. 是否客观无幻觉？
  4. 长度是否合适（约 {max_length} 字）？
  5. 中文是否通顺自然？

  只返回合法的 JSON。
